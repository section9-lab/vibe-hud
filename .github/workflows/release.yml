name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          xcodebuild test \
            -project VibeHUD.xcodeproj \
            -scheme VibeHUD \
            -destination "platform=macOS" \
            -derivedDataPath build/Tests \
            CODE_SIGNING_ALLOWED=NO
          python3 -m unittest tests/test_hook_state_adapter.py -v
          node tests/test_opencode_plugin.mjs
          bash tests/test_release_contract.sh

      - name: Build release app
        run: |
          xcodebuild \
            -project VibeHUD.xcodeproj \
            -scheme VibeHUD \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -destination "generic/platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify tag version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          app_path="build/DerivedData/Build/Products/Release/vibe hud.app"
          tag_version="${TAG_NAME#v}"
          app_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app_path/Contents/Info.plist")
          test "$tag_version" = "$app_version"

      - name: Seal app bundle
        run: |
          app_path="build/DerivedData/Build/Products/Release/vibe hud.app"
          codesign --force --deep --sign - \
            --entitlements VibeHUD/Resources/VibeHUD.entitlements \
            "$app_path"
          codesign --verify --deep --strict "$app_path"

      - name: Package DMG
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          app_path="build/DerivedData/Build/Products/Release/vibe hud.app"
          mkdir -p "release/dmg-root"
          cp -R "$app_path" "release/dmg-root/vibe hud.app"
          ln -s /Applications "release/dmg-root/Applications"
          hdiutil create \
            -volname "vibe hud" \
            -srcfolder "release/dmg-root" \
            -ov \
            -format UDZO \
            "release/vibe-hud-${TAG_NAME}.dmg"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/vibe-hud-${{ github.ref_name }}.dmg
