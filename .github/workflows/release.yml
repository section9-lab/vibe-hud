name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          xcodebuild test \
            -project VibeHUD.xcodeproj \
            -scheme VibeHUD \
            -destination "platform=macOS" \
            -derivedDataPath build/Tests \
            CODE_SIGNING_ALLOWED=NO
          python3 -m unittest tests/test_hook_state_adapter.py -v
          node tests/test_opencode_plugin.mjs
          bash tests/test_release_contract.sh
          bash tests/test_update_signature.sh

      - name: Build release app
        run: |
          xcodebuild \
            -project VibeHUD.xcodeproj \
            -scheme VibeHUD \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -destination "generic/platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify tag version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          app_path="build/DerivedData/Build/Products/Release/vibe hud.app"
          tag_version="${TAG_NAME#v}"
          app_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app_path/Contents/Info.plist")
          test "$tag_version" = "$app_version"

      - name: Seal app bundle
        run: |
          app_path="build/DerivedData/Build/Products/Release/vibe hud.app"
          codesign --force --deep --sign - \
            --entitlements VibeHUD/Resources/VibeHUD.entitlements \
            "$app_path"
          codesign --verify --deep --strict "$app_path"

      - name: Package DMG
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          app_path="build/DerivedData/Build/Products/Release/vibe hud.app"
          mkdir -p "release/dmg-root"
          cp -R "$app_path" "release/dmg-root/vibe hud.app"
          ln -s /Applications "release/dmg-root/Applications"
          hdiutil create \
            -volname "vibe hud" \
            -srcfolder "release/dmg-root" \
            -ov \
            -format UDZO \
            "release/vibe-hud-${TAG_NAME}.dmg"

      - name: Generate GitHub Release appcast
        env:
          TAG_NAME: ${{ github.ref_name }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "SPARKLE_PRIVATE_KEY must be configured before publishing an update" >&2
            exit 1
          fi
          app_path="build/DerivedData/Build/Products/Release/vibe hud.app"
          dmg_path="release/vibe-hud-${TAG_NAME}.dmg"
          sign_update="build/DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update"
          signature=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$sign_update" --ed-key-file - -p "$dmg_path")
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app_path/Contents/Info.plist")
          build=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$app_path/Contents/Info.plist")
          length=$(stat -f%z "$dmg_path")
          cat > release/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>vibe hud</title>
              <item>
                <title>v${version}</title>
                <sparkle:version>${build}</sparkle:version>
                <sparkle:shortVersionString>${version}</sparkle:shortVersionString>
                <pubDate>$(date -u "+%a, %d %b %Y %H:%M:%S %z")</pubDate>
                <enclosure
                  url="https://github.com/section9-lab/vibe-hud/releases/download/${TAG_NAME}/vibe-hud-${TAG_NAME}.dmg"
                  sparkle:version="${build}"
                  sparkle:shortVersionString="${version}"
                  sparkle:edSignature="${signature}"
                  length="${length}"
                  type="application/x-apple-diskimage" />
              </item>
            </channel>
          </rss>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          path = Path("release/appcast.xml")
          path.write_text("\n".join(line[10:] if line.startswith("          ") else line for line in path.read_text().splitlines()) + "\n")
          PY
          swift scripts/verify-update.swift "$app_path" "$dmg_path" release/appcast.xml

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/vibe-hud-${{ github.ref_name }}.dmg
            release/appcast.xml
