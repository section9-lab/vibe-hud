<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1=".5" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#414449"/>
      <stop offset=".43" stop-color="#24272B"/>
      <stop offset="1" stop-color="#101215"/>
    </linearGradient>
    <linearGradient id="edge" x1=".14" y1=".03" x2=".87" y2=".96">
      <stop offset="0" stop-color="#F3F7FA" stop-opacity=".74"/>
      <stop offset=".27" stop-color="#8B949C" stop-opacity=".21"/>
      <stop offset=".72" stop-color="#22262A" stop-opacity=".1"/>
      <stop offset="1" stop-color="#A7AFB6" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1=".15" x2="1" y2=".85">
      <stop offset="0" stop-color="#DCE8EF" stop-opacity=".28"/>
      <stop offset=".38" stop-color="#6E7882" stop-opacity=".2"/>
      <stop offset=".72" stop-color="#252B31" stop-opacity=".5"/>
      <stop offset="1" stop-color="#11161B" stop-opacity=".68"/>
    </linearGradient>
    <linearGradient id="glassRim" x1=".02" y1=".08" x2=".98" y2=".92">
      <stop offset="0" stop-color="#D5FFFF" stop-opacity=".5"/>
      <stop offset=".18" stop-color="#FFFFFF" stop-opacity=".4"/>
      <stop offset=".5" stop-color="#AFA8F5" stop-opacity=".12"/>
      <stop offset=".79" stop-color="#F2B5D6" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FFD08A" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8EFCFF" stop-opacity=".5"/>
      <stop offset=".27" stop-color="#A9C8FF" stop-opacity=".2"/>
      <stop offset=".53" stop-color="#C7A8FF" stop-opacity=".38"/>
      <stop offset=".76" stop-color="#F2A9D0" stop-opacity=".4"/>
      <stop offset="1" stop-color="#FFC66D" stop-opacity=".65"/>
    </linearGradient>
    <linearGradient id="whiteStream" x1=".08" y1=".1" x2=".88" y2=".92">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".05"/>
      <stop offset=".42" stop-color="#FFFFFF" stop-opacity=".84"/>
      <stop offset=".62" stop-color="#EDF8FF" stop-opacity=".46"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="warmFlare">
      <stop offset="0" stop-color="#FFD599" stop-opacity=".72"/>
      <stop offset=".38" stop-color="#FFB56E" stop-opacity=".3"/>
      <stop offset="1" stop-color="#FF9F57" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lowerGlow" cx=".5" cy=".84" r=".7">
      <stop offset="0" stop-color="#050607" stop-opacity=".5"/>
      <stop offset="1" stop-color="#050607" stop-opacity="0"/>
    </radialGradient>
    <filter id="outerShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#030405" flood-opacity=".72"/>
    </filter>
    <filter id="blurWide" x="-35%" y="-45%" width="170%" height="190%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="blurSoft" x="-25%" y="-40%" width="150%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="frost" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .04"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="bodyClip">
      <rect x="26" y="26" width="972" height="972" rx="228"/>
    </clipPath>
    <clipPath id="panelClip">
      <rect x="104" y="102" width="816" height="382" rx="142"/>
    </clipPath>
  </defs>

  <g filter="url(#outerShadow)">
    <rect x="26" y="26" width="972" height="972" rx="228" fill="url(#body)"/>
    <rect x="26" y="26" width="972" height="972" rx="228" fill="url(#lowerGlow)"/>
    <g clip-path="url(#bodyClip)">
      <path d="M82 82c140-85 694-80 852 15" fill="none" stroke="#FFFFFF" stroke-opacity=".17" stroke-width="30" filter="url(#blurWide)"/>
      <path d="M940 134c32 210 22 522-8 750" fill="none" stroke="#B7C0C7" stroke-opacity=".09" stroke-width="22" filter="url(#blurWide)"/>
    </g>
    <rect x="32" y="32" width="960" height="960" rx="222" fill="none" stroke="url(#edge)" stroke-width="12"/>
  </g>

  <path d="M150 466c164 36 568 36 728-2" fill="none" stroke="#05070A" stroke-opacity=".62" stroke-width="34" stroke-linecap="round" filter="url(#blurSoft)"/>
  <rect x="104" y="102" width="816" height="382" rx="142" fill="url(#glass)"/>
  <g clip-path="url(#panelClip)">
    <rect x="104" y="102" width="816" height="382" rx="142" fill="#FFFFFF" filter="url(#frost)" opacity=".3"/>
    <path d="M54 150c137 5 235 60 360 152-119 84-220 132-360 138Z" fill="#7DF5FF" fill-opacity=".25" filter="url(#blurWide)"/>
    <path d="M52 183c149 7 249 54 386 130-129 73-237 113-386 110Z" fill="#C6A4FF" fill-opacity=".2" filter="url(#blurWide)"/>
    <path d="M50 165c151 17 252 58 387 139-130 78-237 115-387 118Z" fill="url(#whiteStream)" filter="url(#blurSoft)" opacity=".94"/>
    <path d="M94 205c117 17 191 45 291 101-98 51-174 78-291 85Z" fill="#FFFFFF" fill-opacity=".26" filter="url(#blurSoft)"/>
    <ellipse cx="908" cy="286" rx="76" ry="194" fill="url(#warmFlare)" filter="url(#blurSoft)"/>
    <path d="M155 462c176 28 555 28 726-3" fill="none" stroke="url(#spectrum)" stroke-width="24" stroke-linecap="round" filter="url(#blurWide)" opacity=".54"/>
    <path d="M154 459c176 24 556 24 727-3" fill="none" stroke="url(#spectrum)" stroke-width="3" stroke-linecap="round" filter="url(#blurSoft)" opacity=".28"/>
    <path d="M172 120c168-22 481-22 645 0" fill="none" stroke="#FFFFFF" stroke-opacity=".15" stroke-width="10" stroke-linecap="round" filter="url(#blurSoft)"/>
  </g>
  <rect x="108" y="106" width="808" height="374" rx="138" fill="none" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="14" filter="url(#blurWide)"/>
  <rect x="109" y="107" width="806" height="372" rx="137" fill="none" stroke="url(#glassRim)" stroke-width="3" opacity=".58"/>
  <path d="M148 145c-31 52-39 147-18 213" fill="none" stroke="#E7FFFF" stroke-opacity=".3" stroke-width="10" stroke-linecap="round" filter="url(#blurWide)"/>
</svg>
